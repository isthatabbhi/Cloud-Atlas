{{> header}}
{{> nav}}
<div class="card shadow-sm border mb-4">
  <div class="card-header bg-white">
    <h3>Edit Supplier</h3>
  </div>
  <div class="card-body">
    <form action="/admin/supplier-update/{{supplier.id}}" method="POST">
      {{#supplier}}
      <div class="form-group">
        <label>Name</label>
        <input type="text" class="form-control" name="name" value="{{name}}" required>
      </div>
      <div class="form-group">
        <label>Address</label>
        <input type="text" class="form-control" name="address" value="{{address}}" required>
      </div>
      <div class="form-group">
        <label>City</label>
        <input type="text" class="form-control" name="city" value="{{city}}" required>
      </div>
      <div class="form-group">
        <label>State</label>
        <input type="text" class="form-control" name="state" value="{{state}}" required>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" class="form-control" name="email" value="{{email}}" required>
      </div>
      <div class="form-group">
        <label>Phone</label>
        <input type="text" class="form-control" name="phone" value="{{phone}}" required>
      </div>
      <button type="submit" class="btn btn-primary">Update</button>
      <a href="/admin/suppliers" class="btn btn-secondary">Cancel</a>
      {{/supplier}}
    </form>
    <hr>
    <form action="/admin/supplier-delete/{{supplier.id}}" method="POST" onsubmit="return confirm('Are you sure you want to delete this supplier?');">
      <button type="submit" class="btn btn-danger">Delete this supplier</button>
    </form>
  </div>
</div>
</div>
</body>
</html>
