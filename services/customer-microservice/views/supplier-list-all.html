{{> header}}
{{> nav}}
<div class="card shadow-sm border">
  <div class="card-header bg-white">
    <h3 class="card-title mb-0">All suppliers</h3>
  </div>
  <div class="card-body p-0">
    <table class="table table-hover mb-0">
      <thead class="thead-light">
        <tr>
          <th>Name</th>
          <th>Address</th>
          <th>City</th>
          <th>State</th>
          <th>Email</th>
          <th>Phone</th>
        </tr>
      </thead>
      <tbody>
        {{#suppliers}}
        <tr>
          <td><strong>{{name}}</strong></td>
          <td>{{address}}</td>
          <td>{{city}}</td>
          <td>{{state}}</td>
          <td>{{email}}</td>
          <td>{{phone}}</td>
        </tr>
        {{/suppliers}}
        {{^suppliers}}
        <tr>
          <td colspan="6" class="text-center py-4 text-muted">No suppliers currently listed.</td>
        </tr>
        {{/suppliers}}
      </tbody>
    </table>
  </div>
</div>
</div>
</body>
</html>
